<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karyera Mentoru</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-indigo-700 text-white">
        <div class="max-w-5xl mx-auto px-4 py-5">
            <h1 class="text-2xl font-bold">🎯 Karyera Mentoru</h1>
            <p class="text-indigo-100 text-sm">CV-ni yüklə, AI ilə analiz et və seçdiyin sahəyə uyğunluğunu gör.</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 grid gap-6 lg:grid-cols-3">
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-white rounded-xl shadow p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">CV (PDF, maksimum 5 MB)</label>
                    <input id="file" type="file" accept="application/pdf,.pdf"
                        class="block w-full text-sm border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Sahə</label>
                    <select id="field" class="block w-full border rounded-lg p-2 text-sm"></select>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button id="btn-match"
                        class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-4 py-2 rounded-lg text-sm font-medium">Sahəyə
                        uyğunluğu yoxla</button>
                    <button id="btn-cv"
                        class="bg-white border border-indigo-600 text-indigo-700 hover:bg-indigo-50 disabled:opacity-50 px-4 py-2 rounded-lg text-sm font-medium">Ümumi
                        CV analizi</button>
                </div>
                <p id="status" class="text-sm"></p>
            </div>
            <div id="result"></div>
        </section>

        <aside>
            <div class="bg-white rounded-xl shadow p-5">
                <h2 class="font-semibold mb-3">📂 Tarixçə</h2>
                <ul id="history" class="space-y-2"></ul>
            </div>
        </aside>
    </main>

    <script>
        const MAX_MB = 5;
        let clientId = localStorage.getItem("karyera_client_id");
        if (!clientId) {
            clientId = crypto.randomUUID();
            localStorage.setItem("karyera_client_id", clientId);
        }

        const $ = (id) => document.getElementById(id);
        let FIELD_NAMES = {};
        const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        const STATUS = {
            has: ["✓ Var", "bg-green-100 text-green-800"],
            partial: ["~ Qismən", "bg-amber-100 text-amber-800"],
            missing: ["✗ Yoxdur", "bg-red-100 text-red-800"],
        };
        const READY = {
            ready: ["Hazırdır", "bg-green-600"],
            almost_ready: ["Az qalıb", "bg-amber-500"],
            needs_work: ["İnkişaf lazımdır", "bg-red-600"],
        };
        const PRIORITY = {
            high: ["Yüksək", "bg-red-100 text-red-800"],
            medium: ["Orta", "bg-amber-100 text-amber-800"],
            low: ["Aşağı", "bg-slate-100 text-slate-700"],
        };

        async function api(path, options = {}, timeoutMs = 60000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(path, {
                    ...options,
                    signal: controller.signal,
                    headers: { ...(options.headers || {}), "X-Client-Id": clientId },
                });
                if (!res.ok) {
                    let msg = "Xəta baş verdi. Yenidən cəhd et.";
                    try {
                        const data = await res.json();
                        if (typeof data.detail === "string") msg = data.detail;
                    } catch { }
                    throw new Error(msg);
                }
                return await res.json();
            } catch (e) {
                if (e.name === "AbortError") throw new Error("Cavab çox gec gəldi. Bir az sonra yenidən cəhd et.");
                throw e;
            } finally {
                clearTimeout(timer);
            }
        }

        function setStatus(msg, isError = false) {
            const el = $("status");
            el.textContent = msg;
            el.className = "text-sm " + (isError ? "text-red-600" : "text-slate-600");
        }

        function setBusy(busy, msg = "") {
            $("btn-match").disabled = busy;
            $("btn-cv").disabled = busy;
            setStatus(msg);
        }

        /* ---------- Render ---------- */
        function scoreBar(score, label) {
            const s = Math.max(0, Math.min(100, Number(score) || 0));
            const color = s >= 75 ? "bg-green-500" : s >= 50 ? "bg-amber-500" : "bg-red-500";
            return `<div>
    <div class="flex justify-between text-sm mb-1"><span>${esc(label)}</span><strong>${s}/100</strong></div>
    <div class="h-3 bg-slate-200 rounded-full overflow-hidden"><div class="h-full ${color}" style="width:${s}%"></div></div>
  </div>`;
        }

        function chips(items, cls = "bg-slate-100 text-slate-700") {
            if (!items || !items.length) return '<p class="text-sm text-slate-500">—</p>';
            return `<div class="flex flex-wrap gap-2">${items.map((i) =>
                `<span class="text-xs px-2 py-1 rounded-full ${cls}">${esc(i)}</span>`).join("")}</div>`;
        }

        function bullets(items) {
            if (!items || !items.length) return '<p class="text-sm text-slate-500">—</p>';
            return `<ul class="list-disc pl-5 space-y-1 text-sm">${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
        }

        function section(title, html) {
            return `<div><h3 class="font-semibold mb-2">${esc(title)}</h3>${html}</div>`;
        }

        function skillList(list) {
            return `<ul class="space-y-2">${list.map((s) => {
                const [label, cls] = STATUS[s.status] || STATUS.missing;
                return `<li class="text-sm border rounded-lg p-2">
      <div class="flex items-center justify-between gap-2">
        <span>${esc(s.skill)}</span>
        <span class="text-xs px-2 py-1 rounded-full whitespace-nowrap ${cls}">${label}</span>
      </div>
      ${s.evidence ? `<p class="text-xs text-slate-500 mt-1">${esc(s.evidence)}</p>` : ""}
    </li>`;
            }).join("")}</ul>`;
        }

        function actionPlan(steps) {
            return `<ol class="space-y-2">${steps.map((s, i) => `
    <li class="border rounded-lg p-3 text-sm">
      <div class="flex justify-between gap-2"><strong>${i + 1}. ${esc(s.title)}</strong>
      <span class="text-xs text-slate-500 whitespace-nowrap">⏱ ${esc(s.timeframe)}</span></div>
      <p class="mt-1">${esc(s.details)}</p>
    </li>`).join("")}</ol>`;
        }

        function renderMatch(r) {
            const [rl, rc] = READY[r.readiness] || READY.needs_work;
            return `<div class="bg-white rounded-xl shadow p-5 space-y-5">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <h2 class="text-xl font-semibold">${esc(r.field_name)}</h2>
      <span class="text-white text-sm px-3 py-1 rounded-full ${rc}">${rl}</span>
    </div>
    ${scoreBar(r.match_score, "Uyğunluq balı")}
    <p class="text-sm">${esc(r.summary)}</p>
    ${section("Tələb olunan bacarıqlar", skillList(r.required_skills))}
    ${section("Arzuolunan bacarıqlar", skillList(r.preferred_skills))}
    ${section("📈 İnkişaf planı", actionPlan(r.action_plan))}
  </div>`;
        }

        function renderCV(r) {
            const a = r.analysis;
            const recs = a.recommendations.map((x) => {
                const [pl, pc] = PRIORITY[x.priority] || PRIORITY.low;
                return `<li class="border rounded-lg p-3 text-sm">
      <div class="flex justify-between gap-2"><strong>${esc(x.title)}</strong>
      <span class="text-xs px-2 py-1 rounded-full whitespace-nowrap ${pc}">${pl}</span></div>
      <p class="mt-1">${esc(x.details)}</p></li>`;
            }).join("");
            return `<div class="bg-white rounded-xl shadow p-5 space-y-5">
    <h2 class="text-xl font-semibold">Ümumi CV analizi</h2>
    ${scoreBar(a.cv_score, "CV keyfiyyət balı (AI təxmini)")}
    <p class="text-sm">${esc(a.summary)}</p>
    ${section("Tapılan bacarıqlar", chips(a.detected_skills, "bg-indigo-100 text-indigo-800"))}
    ${section("💪 Güclü tərəflər", bullets(a.strengths))}
    ${section("⚠️ Zəif tərəflər", bullets(a.weaknesses))}
    ${section("Çatışan bacarıqlar", chips(a.missing_skills, "bg-red-100 text-red-800"))}
    ${section("📈 Tövsiyələr", `<ul class="space-y-2">${recs}</ul>`)}
  </div>`;
        }

        function render(kind, data) {
            $("result").innerHTML = kind === "match" ? renderMatch(data) : renderCV(data);
            $("result").scrollIntoView({ behavior: "smooth" });
        }

        /* ---------- Analiz ---------- */
        async function run(kind) {
            const file = $("file").files[0];
            if (!file) return setStatus("Əvvəlcə PDF faylı seç.", true);
            if (!file.name.toLowerCase().endsWith(".pdf")) return setStatus("Yalnız PDF faylı qəbul olunur.", true);
            if (file.size > MAX_MB * 1024 * 1024) return setStatus(`Fayl çox böyükdür (maksimum ${MAX_MB} MB).`, true);

            const form = new FormData();
            form.append("file", file);
            let url = "/api/cv/analyze";
            if (kind === "match") {
                form.append("field_id", $("field").value);
                url = "/api/match/analyze";
            }

            setBusy(true, "⏳ AI analiz edir...");
            const started = Date.now();
            const ticker = setInterval(() => {
                setStatus(`⏳ AI analiz edir... ${Math.round((Date.now() - started) / 1000)} san`);
            }, 1000);

            try {
                const data = await api(url, { method: "POST", body: form }, 180000);
                setStatus("");
                render(kind, data);
                loadHistory();
            } catch (e) {
                setStatus(e.message, true);
            } finally {
                clearInterval(ticker);
                $("btn-match").disabled = false;
                $("btn-cv").disabled = false;
            }
        }

        /* ---------- Tarixçə ---------- */
        async function loadHistory() {
            try {
                const items = await api("/api/history");
                $("history").innerHTML = items.length
                    ? items.map((i) => `
        <li class="border rounded-lg p-2 text-sm flex justify-between gap-2">
          <button data-open="${i.id}" class="text-left flex-1 hover:text-indigo-700">
            <div class="font-medium">${i.kind === "match" ? esc(FIELD_NAMES[i.field_id] || i.field_id) : "Ümumi analiz"} · ${i.score ?? "-"}/100</div>
            <div class="text-xs text-slate-500 truncate">${esc(i.filename)}</div>
            <div class="text-xs text-slate-400">${new Date(i.created_at).toLocaleString("az-AZ")}</div>
          </button>
          <button data-del="${i.id}" title="Sil" class="text-slate-400 hover:text-red-600">🗑</button>
        </li>`).join("")
                    : '<li class="text-sm text-slate-500">Hələ analiz yoxdur.</li>';
            } catch (e) {
                setStatus(e.message, true);
            }
        }

        $("history").addEventListener("click", async (ev) => {
            const open = ev.target.closest("[data-open]");
            const del = ev.target.closest("[data-del]");
            try {
                if (open) {
                    const d = await api("/api/history/" + open.dataset.open);
                    render(d.kind, d.result);
                } else if (del && confirm("Bu nəticə silinsin?")) {
                    await api("/api/history/" + del.dataset.del, { method: "DELETE" });
                    loadHistory();
                }
            } catch (e) {
                setStatus(e.message, true);
            }
        });

        /* ---------- Başlanğıc ---------- */
        $("btn-match").addEventListener("click", () => run("match"));
        $("btn-cv").addEventListener("click", () => run("cv"));

        (async () => {
            try {
                const fields = await api("/api/match/fields");
                fields.forEach((f) => { FIELD_NAMES[f.id] = f.name; });
                $("field").innerHTML = fields.map((f) => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("");
            } catch (e) {
                setStatus(e.message, true);
            }
            loadHistory();
        })();
    </script>
</body>

</html>
